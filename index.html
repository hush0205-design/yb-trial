<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>□□ — □□□□□</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261005d">
</head>
<body>
<div id="room"><canvas id="cv"></canvas><div id="endnote">— 체험판은 여기까지입니다 —</div></div>
<div id="counter"><span id="cnt">0쪽</span></div>
<div id="setBtn">설정</div>
<div id="fear"></div>

<div id="bookView" class="hidden">
  <div id="stage">
    <div id="book">
      <div id="faces"></div>
      <div id="leaf"></div>
      <div id="loupe"><div id="lz"></div></div>
      <div id="passShadow"></div>
    </div>
    <div id="cover" class="coverFace"><div class="slip">□□</div><div class="bind"></div></div>
    <svg id="deskGlass" class="hidden" viewBox="0 0 170 60">
      <defs><filter id="gblur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="1.6"/></filter>
        <radialGradient id="lens" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#f4f8f8" stop-opacity=".75"/><stop offset=".45" stop-color="#c9d6d6" stop-opacity=".35"/><stop offset="1" stop-color="#5a6a6a" stop-opacity=".55"/></radialGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2e1c"/><stop offset=".5" stop-color="#2e1b10"/><stop offset="1" stop-color="#1e110a"/></linearGradient></defs>
      <g class="obj" transform="rotate(-6 85 30)">
        <rect x="8" y="24" width="154" height="18" rx="3" fill="#000" opacity=".5" filter="url(#gblur)" transform="translate(2,5)"/>
        <rect x="8" y="22" width="154" height="16" rx="3" fill="url(#bar)"/>
        <path d="M20 27 H70 M100 31 H150 M30 34 H62 M108 26 H140" stroke="#5a3a24" stroke-width=".7" opacity=".7"/>
        <rect x="8" y="22" width="12" height="16" rx="3" fill="#a8873e"/><rect x="150" y="22" width="12" height="16" rx="3" fill="#a8873e"/>
        <rect x="19" y="22" width="2" height="16" fill="#6a5224"/><rect x="149" y="22" width="2" height="16" fill="#6a5224"/>
        <ellipse cx="85" cy="32" rx="22" ry="7" fill="#000" opacity=".35" filter="url(#gblur)"/>
        <circle cx="85" cy="27" r="20" fill="#a8873e"/>
        <circle cx="85" cy="27" r="17" fill="url(#lens)"/>
        <path d="M74 19 Q79 13 88 12" stroke="#ffffff" stroke-opacity=".7" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="spot" transform="rotate(-6 85 30)"><rect x="8" y="22" width="154" height="16" rx="3" fill="none" stroke="#c8b98e" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="85" cy="27" r="20" fill="none" stroke="#c8b98e" stroke-width="1.2" stroke-dasharray="3 4"/></g>
      <rect class="hitg" x="0" y="0" width="170" height="60" fill="transparent"/>
    </svg>
    <svg id="thread" width="150" height="70" viewBox="0 0 150 70">
      <defs><filter id="tblur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="0.9"/></filter></defs>
      <path class="tsh" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round" transform="translate(0.6,1.6)" filter="url(#tblur)"/>
      <path class="tln" fill="none" stroke="#cdbf9c" stroke-width="2.2" stroke-linecap="round"/>
      <path class="ttw" fill="none" stroke="#8f8264" stroke-width="2.2" stroke-dasharray="1.2 2.6" stroke-linecap="butt"/>
      <g class="tas"><ellipse cx="1" cy="1.5" rx="7" ry="3.2" fill="#000" opacity=".4" filter="url(#tblur)"/><path d="M0 0 L11 -2.5 L12 3.5 Z" fill="#c9bb98"/><path d="M2 0 L11 -1.2 M2 0.8 L11.5 1 M2 1.6 L11.8 2.6" stroke="#9a8d6c" stroke-width=".5"/></g>
      <path class="hit" fill="none" stroke="transparent" stroke-width="28" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="dimL" class="lightL"></div><div id="warmL" class="lightL"></div>
  <div id="bookBar"><button class="sbtn hidden" id="bGlass">돋보기</button><button class="sbtn hidden" id="bClose">책을 덮는다</button></div>
</div>

<div id="mapView" class="hidden">
  <div id="mapStage"><div id="mapLoupe"></div></div>
  <svg id="mapGlass" class="hidden" viewBox="0 0 170 60"></svg>
  <div id="mapBar"><button class="sbtn hidden" id="bMapGlass">수정 문진으로 비춘다</button><button class="sbtn" id="bMapClose">지도를 접는다</button></div>
</div>
<div class="screen" id="sStart"><div id="title">□□ — □□□□□</div><button class="btn" id="bOpen">궤짝을 연다</button></div>
<div class="screen hidden" id="sJokbo">
  <div class="hanji">
    <h2>族譜</h2>
    <div class="row"><span class="gen">一世</span><span class="scratch"></span></div>
    <div class="row faint"><span class="gen">二世</span>…</div>
    <div class="row faint"><span class="gen">十三世</span>…</div>
    <div class="row faint"><span class="gen">十四世</span><span class="inkline"></span></div>
    <div class="row faint"><span class="gen">十五世</span><span class="inkline"></span></div>
    <div class="row faint"><span class="gen">十六世</span><span class="inkline"></span></div>
    <div class="row"><span class="gen">十七世</span></div>
    <div class="row"><label>성(姓)</label><input id="iSur" maxlength="2" placeholder="윤"><label>본관</label><input id="iBon" maxlength="4" placeholder="파평"></div>
    <div class="row"><label>이름</label><input id="iName" maxlength="3" placeholder="서하"></div>
    <div style="text-align:center;margin-top:22px"><button class="btn" id="bWrite" style="color:var(--ink);border-color:#00000066">적는다</button></div>
  </div>
</div>
<div class="screen hidden" id="sGahun">
  <div id="gahunWrap"><div class="scroll" data-g="0">읽되 믿지 마라</div><div class="scroll" data-g="1">모르는 것은 덮어라</div></div>
</div>
<div id="overlay" class="hidden"><div class="hanji" id="ovBody"></div></div>
