<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>□□ — □□□□□</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#d9ccaf; --ink:#2a2118; --bg:#0b0907; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#cfc3a8; overflow:hidden;
    font-family:'Nanum Myeongjo','Noto Serif KR','Batang',serif; user-select:none; -webkit-user-select:none; }
  #app { position:relative; width:100%; height:100%; max-width:820px; margin:0 auto; display:flex; flex-direction:column; }
  #room { position:relative; flex:1 1 55%; min-height:0; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; touch-action:none; }
  #counter { position:absolute; left:14px; top:10px; font-size:15px; letter-spacing:2px; color:#bfb293; opacity:.85; }
  #book { position:relative; flex:0 0 50%; margin:0 10px 10px; background:var(--paper); color:var(--ink);
    border-radius:3px; display:flex; box-shadow:0 0 0 1px #00000060, 0 6px 30px #000a inset; overflow:hidden; cursor:pointer; }
  .page { flex:1; padding:12px 14px 12px 16px; font-size:13.5px; line-height:1.68; overflow:hidden; position:relative; }
  .page.left { border-right:1px solid #00000025; }
  .ln { white-space:pre-wrap; word-break:keep-all; min-height:1.68em; }
  .ag { display:inline-block; color:#3a2c1e; }
  .ag.r1 { transform:scaleX(-1); } .ag.r2 { transform:rotate(90deg); } .ag.r3 { transform:scale(-1,-1); } .ag.r4 { transform:rotate(-90deg) scaleX(-1); }
  #margin, .lzm { position:absolute; right:4px; top:10px; bottom:10px; width:20px; writing-mode:vertical-rl;
    font-size:12px; color:#3b2f22; opacity:.28; letter-spacing:6px; transform:rotate(1.5deg); pointer-events:none; }
  #book { perspective:1800px; }
  .page, .face { background-color:var(--paper); }
  #leaf { position:absolute; top:0; bottom:0; left:50%; width:50%; transform-style:preserve-3d; pointer-events:none; display:none; z-index:3; }
  .strip { position:absolute; top:0; height:100%; transform-style:preserve-3d; transform-origin:left center; }
  .sface { position:absolute; top:0; bottom:0; left:-0.5px; right:-0.5px; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; background-color:var(--paper); }
  .sface.back { transform:rotateY(180deg); }
  .pc { position:absolute; top:0; height:100%; padding:12px 14px 12px 16px; font-size:13.5px; line-height:1.68; background-color:var(--paper); }
  .sh { position:absolute; inset:0; pointer-events:none; background:#4a3418; opacity:0; }
  .page::before, .pc::before { content:''; position:absolute; inset:0; pointer-events:none; opacity:.55;
    background:repeating-linear-gradient(83deg, #0000 0 3px, #6a5a3a0d 3px 4px), repeating-linear-gradient(-9deg, #0000 0 7px, #ffffff1c 7px 8px); }
  #leaf.turn { display:block; animation:turn .85s cubic-bezier(.45,.05,.25,1) forwards; }
  #leaf.turn.slow, #leaf.turn.slow .face::after { animation-duration:1.9s; }
  #ear { position:absolute; right:0; bottom:0; width:30px; height:30px; z-index:4; pointer-events:none; opacity:.1; transition:opacity .3s;
    background:linear-gradient(135deg, transparent 50%, #b3a27c 50%); box-shadow:-2px -2px 5px #0002; }
  #ear.ready { opacity:1; }
  @keyframes turn { from { transform:rotateY(0deg); } to { transform:rotateY(-180deg); } }
  .face { position:absolute; inset:0; padding:12px 14px 12px 16px; font-size:13.5px; line-height:1.68; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face.front { box-shadow:inset 8px 0 18px -10px #0006; }
  .face.back { transform:rotateY(180deg); box-shadow:inset -8px 0 18px -10px #0006; }
  #leaf.turn .face::after { content:''; position:absolute; inset:0; pointer-events:none; animation:shade .85s forwards; }
  @keyframes shade { 0%{background:#0000} 50%{background:#00000038} 100%{background:#0000} }
  #bookShade { position:absolute; inset:0; pointer-events:none; z-index:5; transition:opacity 2.5s;
    background:radial-gradient(ellipse at 50% 40%, #0d0a0799 0%, #0d0a07f0 85%); opacity:1; }
  #book.lit #bookShade { opacity:.12; animation:flick 3.3s infinite; }
  @keyframes flick { 0%,100%{opacity:.12} 37%{opacity:.18} 41%{opacity:.08} 70%{opacity:.15} }
  .nw { animation:ink 1.6s ease-out; }
  @keyframes ink { from { color:#000; text-shadow:0 0 6px #7a4a1a99; } to { color:inherit; text-shadow:none; } }
  #margin.seen, .lzm.seen { opacity:.62; color:#5a2414; }
  .tiny { font-size:4.5px; letter-spacing:0; margin-top:10px; opacity:.95; color:#3a1a10; }
  #loupe { position:absolute; width:150px; height:150px; border-radius:50%; overflow:hidden; display:none; z-index:6; pointer-events:none;
    background:var(--paper); border:4px solid #8a7a4a; box-shadow:0 0 0 2px #0009, 0 10px 24px #000a, inset 0 0 18px #0004; }
  #loupe .lz { position:absolute; left:0; top:0; transform-origin:0 0; display:flex; color:var(--ink); }
  #book.loupe { cursor:none; touch-action:none; }
  #pageno { position:absolute; bottom:4px; left:50%; transform:translateX(-50%); font-size:11px; opacity:.35; }
  #fear { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1.2s;
    background:radial-gradient(ellipse at center, transparent 45%, #000000ee 100%); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); z-index:20; }
  .hidden { display:none !important; }
  #title { font-size:30px; letter-spacing:10px; color:#8d8168; margin-bottom:60px; }
  .btn { background:none; border:1px solid #6d6350; color:#cfc3a8; padding:10px 26px; font:inherit; font-size:16px; letter-spacing:4px; cursor:pointer; }
  .btn:hover { border-color:#a99a7a; }
  .hanji { background:var(--paper); color:var(--ink); padding:28px 30px; width:min(92vw,420px); box-shadow:0 10px 40px #000; }
  .hanji h2 { text-align:center; letter-spacing:14px; margin:0 0 20px; font-weight:700; }
  .row { display:flex; align-items:center; gap:10px; margin:12px 0; font-size:15px; }
  .row .gen { width:56px; color:#5a4a36; }
  .scratch { flex:1; height:16px; background:repeating-linear-gradient(-20deg,#2a2118 0 2px,transparent 2px 5px); opacity:.55; }
  .row input { font:inherit; font-size:16px; background:transparent; border:none; border-bottom:1px solid #00000055; color:var(--ink); padding:2px 4px; width:100%; outline:none; }
  .row label { white-space:nowrap; font-size:13px; color:#5a4a36; }
  .faint { color:#5a4a3680; }
  #gahunWrap { display:flex; gap:28px; }
  .scroll { background:var(--paper); color:var(--ink); writing-mode:vertical-rl; font-size:22px; letter-spacing:8px;
    padding:26px 18px; min-height:300px; border-top:10px solid #3a2a1c; border-bottom:10px solid #3a2a1c; cursor:pointer; box-shadow:0 8px 30px #000; }
  .scroll:hover { filter:brightness(1.06); }
  #overlay { position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center; z-index:30; }
  #overlay .hanji { max-height:84vh; overflow:auto; font-size:15px; line-height:1.9; }
  #overlay .hanji h3 { margin:0 0 12px; letter-spacing:6px; font-size:16px; }
  .side { cursor:pointer; min-height:220px; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .side .hj { font-size:26px; letter-spacing:6px; margin:10px 0 18px; }
  .side .kr { font-size:15px; min-height:1.9em; }
  .side .note { font-size:14px; color:#6a2a16; font-style:italic; transform:rotate(-1.2deg); padding:0 6px; }
  .side .pg { font-size:11px; opacity:.5; margin-top:22px; }
  .spine { display:flex; justify-content:space-between; }
  .rec { padding:8px 0; border-bottom:1px solid #00000022; cursor:pointer; }
  .close { margin-top:18px; text-align:center; font-size:13px; opacity:.6; }
  #endnote { position:absolute; left:0; right:0; bottom:6px; text-align:center; font-size:12px; color:#8d8168; opacity:0; transition:opacity 3s; pointer-events:none; }
  #reset { position:fixed; right:10px; top:8px; font-size:13px; color:#a99a7a; opacity:.75; cursor:pointer; z-index:40; padding:4px 8px; border:1px solid #6d635088; }
</style>
</head>
<body>
<div id="app">
  <div id="room"><canvas id="cv"></canvas><div id="counter">쪽 <span id="cnt">0</span></div><div id="endnote">— 체험판은 여기까지입니다 —</div></div>
  <div id="book"><div class="page left" id="pL"></div><div class="page right" id="pR"></div><div id="margin"></div><div id="leaf"></div><div id="ear" class="ready"></div><div id="pageno"></div><div id="loupe"><div class="lz" id="lz"></div></div><div id="bookShade"></div></div>
</div>
<div id="fear"></div>

<div class="screen" id="sStart"><div id="title">□□ — □□□□□</div><button class="btn" id="bOpen">궤짝을 연다</button></div>

<div class="screen hidden" id="sJokbo">
  <div class="hanji">
    <h2>族譜</h2>
    <div class="row"><span class="gen">一世</span><span class="scratch"></span></div>
    <div class="row faint"><span class="gen">二世</span>…</div>
    <div class="row faint"><span class="gen">十六世</span>…</div>
    <div class="row"><span class="gen">十七世</span></div>
    <div class="row"><label>성(姓)</label><input id="iSur" maxlength="2" placeholder="윤"><label>본관</label><input id="iBon" maxlength="4" placeholder="파평"></div>
    <div class="row"><label>이름</label><input id="iName" maxlength="3" placeholder="서하"></div>
    <div style="text-align:center;margin-top:22px"><button class="btn" id="bWrite" style="color:var(--ink);border-color:#00000066">적는다</button></div>
  </div>
</div>

<div class="screen hidden" id="sGahun">
  <div id="gahunWrap">
    <div class="scroll" data-g="0">읽되 믿지 마라</div>
    <div class="scroll" data-g="1">모르는 것은 덮어라</div>
  </div>
</div>

<div id="overlay" class="hidden"><div class="hanji" id="ovBody"></div></div>
<div id="reset" title="처음부터">처음부터</div>

<script>
(() => {
'use strict';
// ───────── 상태 ─────────
const SAVE = 'yeobaek_trial_v1';
const S = Object.assign({
  stage:'start', sur:'', bon:'', name:'', gahun:-1,
  pages:0, earned:0, D:0, owned:{}, fear:0,
  letterRead:false, chair:false, glitchDone:false, lastBrew:-1e9
}, JSON.parse(localStorage.getItem(SAVE) || '{}'));
let resetting = false;
const save = () => { if (!resetting) localStorage.setItem(SAVE, JSON.stringify(S)); };

// ───────── 성씨 한자 ─────────
const HJ = {김:'金',이:'李',박:'朴',최:'崔',정:'鄭',강:'姜',조:'趙',윤:'尹',장:'張',임:'林',한:'韓',오:'吳',서:'徐',신:'申',권:'權',황:'黃',안:'安',송:'宋',류:'柳',유:'柳',전:'全',홍:'洪',고:'高',문:'文',양:'梁',손:'孫',배:'裵',백:'白',허:'許',남:'南',심:'沈',노:'盧',하:'河',곽:'郭',성:'成',차:'車',주:'朱',우:'禹',구:'具',민:'閔',진:'陳',나:'羅',지:'池',엄:'嚴',채:'蔡',원:'元',천:'千',방:'方',공:'孔',현:'玄',함:'咸',변:'卞',염:'廉',여:'呂',추:'秋',도:'都',소:'蘇',석:'石',선:'宣',설:'薛',마:'馬',길:'吉',연:'延',위:'魏',표:'表',명:'明',기:'奇',반:'潘',왕:'王',금:'琴',옥:'玉',육:'陸',인:'印',맹:'孟',제:'諸',탁:'卓',국:'鞠',어:'魚',은:'殷',편:'片',용:'龍',예:'芮',경:'景',봉:'奉',사:'史',부:'夫',모:'牟',태:'太',호:'胡',피:'皮',빈:'賓',라:'羅',갈:'葛',궁:'宮',보:'甫',독:'獨'};
const TWO = {남궁:'南宮',제갈:'諸葛',선우:'鮮于',독고:'獨孤',황보:'皇甫',사공:'司空',서문:'西門'};
const hanjaOf = s => TWO[s] || Array.from(s).map(c => HJ[c] || c).join('');

// ───────── 낯선 문자 ─────────
function rng(seed){ let x = seed*9301+49297; return () => (x = (x*9301+49297)%233280)/233280; }
function glyphs(model, seed){
  const r = rng(seed); return Array.from(model).map(c => /\s/.test(c) ? c : String.fromCharCode(0x2F00 + Math.floor(r()*214))).join('');
}
const hash = (a,b) => { let h = (a*374761393 + b*668265263) >>> 0; h = (h^(h>>>13))*1274126177 >>> 0; return (h % 1000)/1000; };

// ───────── 첫 책 문장 ─────────
function buildLines(){
  const s = S.sur || '윤', h = hanjaOf(s);
  const L = [
    { idu:`${h}氏 家門 書庫良中 藏置爲乎 冊 數爻乙 後錄爲白齊`, old:`${s}시 가문 셔고애 갈ᄆᆞ 둔 ᄎᆡᆨ 수ᄅᆞᆯ 뒤헤 젹ᄂᆞ니라`, mod:`${s}씨 가문 서고에 갈무리해 둔 책의 수를 뒤에 적는다.` },
    { idu:'小學 一卷 前張是 落去爲齊', old:'쇼ᄒᆞᆨ ᄒᆞᆫ 권. 앏 쟝이 ᄠᅥ러뎌 나감.', mod:'소학 한 권. 앞 장이 떨어져 나감.' },
    { idu:'農家集成 二卷', old:'농가집셩 두 권.', mod:'농가집성 두 권.' },
    { idu:'東醫寶鑑 雜病篇 三卷 肝乙 論爲在 張良中 手垢多齊', old:'동의보감 잡병편 세 권. 간ᄋᆞᆯ 다론 쟝애 손ᄣᅢ 만ᄒᆞᆷ.', mod:'동의보감 잡병편 세 권. 간(肝)을 다룬 장에 손때가 많음.' },
    { idu:'時調 一束 誰矣 編爲乎喩 不知齊', old:'시됴 무금 ᄒᆞᆫ 권. 뉘 엮건디 모ᄅᆞᆷ.', mod:'시조 묶음 한 권. 누가 엮었는지 모름.' },
    { idu:'地圖 一張 海邊 半是 空爲齊', old:'디도 ᄒᆞᆫ 쟝. 바ᄅᆞᆯ 녁 반이 뷔여 이숌.', mod:'지도 한 장. 바다 쪽 절반이 비어 있음.' },
    { idu:'無題冊 一卷 櫃中', old:'뎨목 업슨 ᄎᆡᆨ ᄒᆞᆫ 권. 궤ᄶᆞᆨ 안.', mod:'제목 없는 책 한 권. 궤짝 안.' },
    { idu:'都合 十三卷', old:'모도 열세 권.', mod:'모두 열세 권.' },
    { idu:'夜良中 此冊乙 越爲在 者隱', old:'밤의 이 ᄎᆡᆨ을 넘기ᄂᆞᆫ 이ᄂᆞᆫ', mod:'밤에 이 책을 넘기는 이는' },
    { idu:'先只 茶乙 煎爲乎事', old:'몬져 차ᄅᆞᆯ 글힐 것.', mod:'먼저 차를 끓일 것.' },
    { idu:'手是 戰慄爲去等 覆爲乎事', old:'손이 ᄯᅥᆯ리거든 더플 것.', mod:'손이 떨리거든 덮을 것.' },
  ];
  return L.map((l,i) => {
    const g = glyphs(l.mod, i+7);
    const v = [g];
    if (i === 0) v.push(h + Array.from(g).slice(Array.from(h).length).join('')); // 처음 풀리는 글자 = 성씨
    v.push(l.idu, l.old, l.mod);
    return v;
  });
}
let LINES = buildLines();
const PER = 60;                                   // 단계 하나 넘어가는 데 드는 해독
const lineStart = i => i < 8 ? i*70 : 780 + (i-8)*70;
const lineDone  = i => lineStart(i) + (LINES[i].length-1)*PER;
const T = { door: lineDone(7), fearOn: lineDone(8), tea: lineDone(9), glitch: 1150, letter: 1300, rightPage: 700 };

function mix(a, b, f, seed){
  const A = Array.from(a), B = Array.from(b), n = Math.max(A.length, B.length); let out = '';
  for (let k=0;k<n;k++) out += hash(seed,k) < f ? (B[k]||'') : (A[k]||'');
  return out;
}
function lineText(i, Dv){
  const D = Dv === undefined ? S.D : Dv;
  const v = LINES[i], p = Math.max(0, Math.min(v.length-1, (D - lineStart(i))/PER));
  const s = Math.floor(p); if (s >= v.length-1) return v[v.length-1];
  return mix(v[s], v[s+1], p - s, i*131);
}

// ───────── 책 패널 ─────────
const pL = document.getElementById('pL'), pR = document.getElementById('pR');
const isAlien = ch => { const c = ch.codePointAt(0); return c >= 0x2F00 && c <= 0x2FD5; };
function alienHtml(str){
  return Array.from(str).map((ch,k) => isAlien(ch) ? `<span class="ag r${(ch.codePointAt(0)+k)%5}">${ch}</span>` : ch.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('');
}
let prevTxt = [];
function lineHtml(i, mark){
  const now = Array.from(lineText(i)), old = Array.from(prevTxt[i] || '');
  return now.map((ch,k) => {
    if (isAlien(ch)) return `<span class="ag r${(ch.codePointAt(0)+k)%5}">${ch}</span>`;
    const e = ch.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    return (mark && old[k] !== ch && ch.trim()) ? `<span class="nw">${e}</span>` : e;
  }).join('');
}
function stain(n){ const a = hash(n,1), b = hash(n,2), c = hash(n,3);
  return `radial-gradient(circle at ${10+a*80}% ${10+b*80}%, #8a6a3a${c>.5?'22':'14'} 0, #0000 ${8+c*14}%), radial-gradient(circle at ${90-b*70}% ${85-a*60}%, #5a3a1a12 0, #0000 ${5+a*9}%)`; }
function pageHtml(from, to, mark){ let h = ''; for (let i=from;i<to;i++) h += `<div class="ln">${lineHtml(i, mark)}</div>`; return h; }
function leftHtml(mark){ return pageHtml(0, 8, mark); }
function rightHtml(mark){ return S.D >= T.rightPage ? pageHtml(8, 11, mark) : ''; }
function snapshot(){ prevTxt = LINES.map((_,i) => lineText(i)); }
function marginHtml(){
  const nm = (hanjaOf(S.sur||'') + '氏 十七世 ' + (S.name||'')).replace(/[&<>]/g,'');
  return alienHtml(glyphs('토끼 아래 두고왔다', 99).replace(/ /g,'　')) + `<div class="tiny">${nm}</div>`;
}
function renderBook(){
  document.getElementById('margin').innerHTML = marginHtml();
  pL.innerHTML = leftHtml(false); pR.innerHTML = rightHtml(false); snapshot();
  pL.style.backgroundImage = stain(S.earned*2); pR.style.backgroundImage = stain(S.earned*2+1);
  document.getElementById('pageno').textContent = S.earned ? `${S.earned}` : '';
  document.getElementById('book').classList.toggle('lit', !!S.owned.lamp);
  document.getElementById('margin').classList.toggle('seen', !!S.owned.glass);
}
const book = document.getElementById('book'), loupe = document.getElementById('loupe'), lz = document.getElementById('lz');
let loupeOn = false, loupeX = 0, loupeY = 0;
const LR = 75, LZ = 2.2;
function pageHtmlAt(from, to, Dv){ let h = ''; for (let i=from;i<to;i++) h += `<div class="ln">${alienHtml(lineText(i, Dv))}</div>`; return h; }
function buildLoupe(){
  const Dp = S.D + PER*0.8;   // 크게 보면 아직 안 풀린 글자도 조금 읽힘
  lz.style.width = book.clientWidth + 'px'; lz.style.height = book.clientHeight + 'px';
  lz.innerHTML = `<div class="page left" style="background-image:${pL.style.backgroundImage}">${pageHtmlAt(0,8,Dp)}</div>`
    + `<div class="page right" style="background-image:${pR.style.backgroundImage}">${S.D >= T.rightPage ? pageHtmlAt(8,11,Dp) : ''}</div>`
    + `<div class="lzm${S.owned.glass ? ' seen' : ''}">${marginHtml()}</div>`;
  placeLoupe();
}
function placeLoupe(){
  loupe.style.left = (loupeX - LR) + 'px'; loupe.style.top = (loupeY - LR) + 'px';
  lz.style.transform = `translate(${LR - loupeX*LZ}px, ${LR - loupeY*LZ}px) scale(${LZ})`;
}
function toggleLoupe(){

const leaf = document.getElementById('leaf');

function buildLeaf(frontHtml, frontBg, backHtml, backBg){

  const Wl = book.clientWidth / 2, w = Wl / NS;
  let parent = leaf;
  for (let i=0; i<NS; i++){

// 끝(바깥쪽)이 먼저 들리고, 종이가 휘었다가 펴지며 내려앉음
function animateLeaf(dur, done){
  const t0 = performance.now(); leaf.style.display = 'block';
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    const e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    const base = -180 * Math.pow(e, 1.12);
    const bend = 85 * Math.sin(Math.PI * Math.min(1, t*1.15)) * (1 - t*0.85);
    let cum = 0;
    for (let i=0; i<NS; i++){
      const d = i === 0 ? base : -bend * (2*i) / (NS*(NS-1));
      cum += d; strips[i].style.transform = `rotateY(${d}deg)`;
      const op = (0.03 + 0.2 * Math.abs(Math.sin(cum * Math.PI / 180))).toFixed(3);
      shades[i].forEach(x => x.style.opacity = op);
    }
    if (t < 1) anim = requestAnimationFrame(step); else { anim = null; done(); }
  };
  anim = requestAnimationFrame(step);
}

let AC = null;

function noise(dur, freq, gain, type='bandpass'){
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let k=0;k<len;k++) d[k] = (Math.random()*2-1) * Math.pow(1-k/len, 2);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(f).connect(g).connect(a.destination); src.start();
}

function model(w,d,h,fn){
  const layers = [];
  for (let z=0; z<h; z++){
    const c = document.createElement('canvas'); c.width=w; c.height=d;
    const g = c.getContext('2d'), im = g.createImageData(w,d); let any = false;
    for (let y=0;y<d;y++) for (let x=0;x<w;x++){
      const col = fn(x,y,z); if (!col) continue; any = true;
      const [r,gg,b] = hex(col), sh = 0.72 + 0.28*(z/Math.max(1,h-1)), o=(y*w+x)*4;
      im.data[o]=r*sh; im.data[o+1]=gg*sh; im.data[o+2]=b*sh; im.data[o+3]=255;
    }
    g.putImageData(im,0,0); layers.push(any ? c : null);
  }
  return { w, d, h, layers };
}

    ev.stopPropagation();
    if (books[+el.dataset.i][1]) readDongui();
    else openOv('<h3>책장</h3>꺼내지지 않는다.<br>옆 책과 붙어 있다.');
  }));
}
function readDongui(){
  let idx = 0, shown = false;
  const draw = () => {
    const p = DONGUI[idx];
    openOv(`<h3>동의보감 三 — 잡병편</h3><div class="rec side" id="sideP">`
      + (p.h ? `<div class="hj">${p.h}</div><div class="kr">${shown ? p.k : ''}</div>` : `<div class="note">${p.note}</div>`)
      + `<div class="pg">${idx+1} / ${DONGUI.length}</div></div>`);
    document.getElementById('sideP').addEventListener('click', ev => {
      ev.stopPropagation();
      if (p.h && !shown) { shown = true; noise(0.08, 3000, 0.05); draw(); return; }
      idx++; shown = false; sFlip();
      if (idx < DONGUI.length) { draw(); return; }
      const first = !(S.sideRead && S.sideRead.dongui);
      S.sideRead = Object.assign({}, S.sideRead, { dongui: true }); save();
      openOv('<h3>동의보감 三</h3>다 읽었다.<br>간을 다룬 장에만 손때가 많다. 누군가 이 장만 여러 번 펼쳤다.' + (first ? '<br><br>두려움이 조금 더디게 찾아온다.' : ''));
    });
  };
  draw();
}
function recDongui(){
  return '<h3>동의보감 三 — 간 장</h3>' + DONGUI.map(p => p.h ? `${p.h}<br>${p.k}` : `<span style="color:#6a2a16;font-style:italic">${p.note}</span>`).join('<br><br>');
}
function letterHtml(){ return `<h3>편지</h3>${esc(S.sur)}씨 가문 서고에 올립니다.<br><br>저는 글자를 읽는 일을 해 온 사람입니다. 댁의 서고에 읽히지 않는 책이 있다는 말을 들었습니다.<br>누구에게 들었는지는 기억나지 않습니다.<br><br>서고에서 일하게 해 주십시오. 밤에는 일하지 않겠습니다.<br><br><div style="text-align:right">한서진(韓瑞眞) 올림.</div>`; }
function showLibrary(){
  const recs = [['족보 첫 장', recJokbo], ['서고 장부', recLedger]];
  if (S.owned.brush) recs.push(['해독 노트', recNotes]);
  if (S.sideRead && S.sideRead.dongui) recs.push(['동의보감 三 — 간 장', recDongui]);
  if (S.letterRead) recs.push(['편지 — 한서진', letterHtml]);
  openOv('<h3>도서관</h3>' + recs.map((r,i)=>`<div class="rec" data-i="${i}">${r[0]}</div>`).join(''));
  ovBody.querySelectorAll('.rec').forEach(el => el.addEventListener('click', ev => { ev.stopPropagation(); openOv(recs[+el.dataset.i][1]()); }));
}
function readLetter(){ openOv(letterHtml(), () => { S.letterRead = true; S.chair = true; save(); sPlace();
  setTimeout(()=>document.getElementById('endnote').style.opacity = 1, 2500); }); }

// ───────── 입력 ─────────
let down = null;
cv.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, a:drag, moved:false, th: e.pointerType === 'mouse' ? 6 : 16 }; try { cv.setPointerCapture(e.pointerId); } catch(_){} });
cv.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - down.x; if (Math.abs(dx) > down.th) down.moved = true; if (down.moved) drag = down.a + dx*0.008; });
cv.addEventListener('pointercancel', () => { down = null; });
cv.addEventListener('pointerup', e => {
  const d = down; down = null; if (!d || d.moved || S.stage !== 'room') return;
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left)*DPR, py = (e.clientY - r.top)*DPR;
  let best = null, bd = 1e9;
  for (const o of OBJ){ if (!o.hit) continue; const h = o.hit, cy = Math.max(h.y1, Math.min(h.y0, py)), dd = Math.hypot(px-h.x, py-cy); if (dd < h.r && dd < bd){ bd = dd; best = o; } }
  if (!best) { if (loupeOn) toggleLoupe(); return; }
  if (best.hit.ghost) buy(best); else if (best.click) best.click(); else if (ITEM[best.id]) showItem(best.id);
});
document.getElementById('book').addEventListener('click', () => { if (S.stage === 'room' && !loupeOn) flip(); });
document.getElementById('reset').addEventListener('click', () => {
  openOv('<h3>처음부터</h3>지금까지의 기록이 모두 지워집니다.<div style="text-align:center;margin-top:18px"><button class="btn rec" id="bReset" style="color:var(--ink);border-color:#00000066">지우고 처음부터</button></div>');
  document.getElementById('bReset').addEventListener('click', ev => { ev.stopPropagation(); localStorage.removeItem(SAVE); resetting = true; location.reload(); });
});
// 주소 끝에 ?new 를 붙여 열어도 처음부터
if (/[?&]new\b/.test(location.search)) { localStorage.removeItem(SAVE); history.replaceState(null, '', location.pathname); location.reload(); }

// ───────── 화면 전환 ─────────
const scr = id => ['sStart','sJokbo','sGahun'].forEach(k => document.getElementById(k).classList.toggle('hidden', k !== id));
function enterRoom(){ S.stage = 'room'; save(); scr(null); LINES = buildLines(); renderBook(); }
document.getElementById('bOpen').onclick = () => { ac(); sFlip(); S.stage = 'jokbo'; scr('sJokbo'); };
document.getElementById('bWrite').onclick = () => {
  const sur = document.getElementById('iSur').value.trim(), nm = document.getElementById('iName').value.trim();
  if (!/^[가-힣]{1,2}$/.test(sur) || !/^[가-힣]{1,3}$/.test(nm)) { document.getElementById(!/^[가-힣]{1,2}$/.test(sur)?'iSur':'iName').focus(); return; }
  S.sur = sur; S.name = nm; S.bon = document.getElementById('iBon').value.trim(); sFlip(); S.stage = 'gahun'; save(); scr('sGahun');
};
document.querySelectorAll('.scroll').forEach(el => el.onclick = () => { S.gahun = +el.dataset.g; sPlace(); enterRoom(); });

window.__yb = { toggleLoupe: () => toggleLoupe(), hits: () => OBJ.filter(o => o.hit).map(o => ({ id:o.id, x:o.hit.x/DPR, y:(o.hit.y0*0.4 + o.hit.y1*0.6)/DPR })) };
resize();
if (S.stage === 'room') enterRoom(); else if (S.stage === 'gahun') scr('sGahun'); else if (S.stage === 'jokbo') scr('sJokbo'); else scr('sStart');
setInterval(() => { if (S.stage === 'room') save(); }, 2000);
requestAnimationFrame(frame);
})();
</script>
</body>
