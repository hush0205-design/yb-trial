<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>□□ — □□□□□</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#d9ccaf; --ink:#2a2118; --bg:#0b0907; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#cfc3a8; overflow:hidden;
    font-family:'Nanum Myeongjo','Noto Serif KR','Batang',serif; user-select:none; -webkit-user-select:none; }
  .hidden { display:none !important; }

  /* 서고 */
  #room { position:fixed; inset:0; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; touch-action:none; }
  #counter { position:fixed; left:14px; top:10px; font-size:15px; letter-spacing:2px; color:#bfb293; opacity:.85; z-index:25; }
  #setBtn { position:fixed; right:10px; top:8px; font-size:13px; color:#a99a7a; opacity:.75; cursor:pointer; z-index:25; padding:4px 8px; border:1px solid #6d635088; }
  #endnote { position:fixed; left:0; right:0; bottom:10px; text-align:center; font-size:12px; color:#8d8168; opacity:0; transition:opacity 3s; pointer-events:none; }
  #fear { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1.2s; z-index:13;
    background:radial-gradient(ellipse at center, transparent 45%, #000000ee 100%); }

  /* 책 화면 */
  #bookView { position:fixed; inset:0; z-index:12; display:flex; flex-direction:column; align-items:center; justify-content:center; isolation:isolate;
    background-color:#3a2414;
    background-image:repeating-linear-gradient(0deg, #00000000 0 41px, #0000001a 41px 43px, #00000000 43px 97px, #ffffff08 97px 98px),
      repeating-linear-gradient(0deg, #4a2e1a 0, #3d2615 7px, #46301c 15px, #3a2414 23px); }

  #stage { position:relative; display:flex; align-items:center; justify-content:center; }
  #book { position:relative; perspective:2200px; z-index:2; }
  #faces { display:flex; position:absolute; inset:0; }
  .face { position:relative; flex:0 0 auto; background-color:var(--paper); overflow:hidden; color:var(--ink);
    box-shadow:inset 0 0 40px #5a3a1a22, 0 0 0 1px #00000055, 0 2px 3px #000a, 0 6px 14px #0007; }
  .face::before, .pc::before { content:''; position:absolute; inset:0; pointer-events:none; opacity:.55;
    background:repeating-linear-gradient(83deg, #0000 0 3px, #6a5a3a0d 3px 4px), repeating-linear-gradient(-9deg, #0000 0 7px, #ffffff1c 7px 8px); }
  .rule { position:absolute; top:calc(var(--pt) - 8px); bottom:14px; left:12px; right:12px; border:4px double #6a4a2a88; pointer-events:none; }
  .txt { position:absolute; top:var(--pt); bottom:20px; left:18px; right:18px; writing-mode:vertical-rl; font-size:var(--fs); line-height:var(--lh);
    word-break:break-all; overflow:hidden; padding:4px 0;
    background-image:repeating-linear-gradient(to left, transparent 0, transparent calc(var(--lh) - 1px), #6a4a2a2e calc(var(--lh) - 1px), #6a4a2a2e var(--lh)); }
  .horiz .txt { writing-mode:horizontal-tb; background-image:none; word-break:keep-all; line-height:1.7; padding:4px 2px; }
  .ln { white-space:pre-wrap; }
  .ag { display:inline-block; color:#3a2c1e; }
  .ag.r1 { transform:scaleX(-1); } .ag.r2 { transform:rotate(90deg); } .ag.r3 { transform:scale(-1,-1); } .ag.r4 { transform:rotate(-90deg) scaleX(-1); }
  .nw { animation:ink 1.8s ease-out; }
  @keyframes ink { from { color:#000; text-shadow:0 0 6px #7a4a1a99; } to { color:inherit; text-shadow:none; } }
  .mg { position:absolute; top:10px; height:calc(var(--pt) - 22px); right:22px; left:22px; writing-mode:vertical-rl; font-size:11px; line-height:1.5;
    color:#3b2f22; opacity:.28; overflow:hidden; transform:rotate(-1deg); pointer-events:none; }
  .mg.seen { opacity:.62; color:#5a2414; }
  .tiny { font-size:4.5px; line-height:1; color:#3a1a10; margin-inline-start:6px; }
  #ear { position:absolute; left:0; bottom:0; width:30px; height:30px; z-index:2; pointer-events:none; opacity:.12; transition:opacity .3s;
    background:linear-gradient(225deg, transparent 50%, #b3a27c 50%); box-shadow:2px -2px 5px #0002; }
  #ear.ready { opacity:1; }
  #bookView.chest { background-color:#1d130b;
    background-image:radial-gradient(ellipse 80% 75% at 50% 50%, #0000 55%, #000000d0 100%),
      repeating-linear-gradient(0deg, #00000000 0 58px, #00000040 58px 61px),
      repeating-linear-gradient(0deg, #2a1a0e 0, #22150b 11px, #2a1b10 23px, #1e1309 34px); }
  .lightL { position:fixed; inset:0; pointer-events:none; z-index:8; mix-blend-mode:multiply; transition:opacity 2.5s; }
  #bookBar { position:relative; z-index:9; }
  #dimL { opacity:1; background:radial-gradient(ellipse 34% 16% at 52% 84%, rgba(120,122,140,.75) 0%, rgba(120,122,140,0) 100%),
    radial-gradient(ellipse 60% 50% at 70% 26%, rgb(160,164,184) 0%, rgb(96,98,114) 30%, rgb(32,32,40) 64%, rgb(12,12,16) 100%); }
  #warmL { opacity:0; background:radial-gradient(ellipse 70% 75% at 50% 62%, rgb(255,246,226) 0%, rgb(236,214,176) 38%, rgb(150,116,80) 72%, rgb(60,42,28) 100%); }
  #bookView.lit #dimL { opacity:0; }
  #bookView.lit #warmL { opacity:1; animation:flick 3.3s infinite; }
  @keyframes flick { 0%,100%{opacity:1} 37%{opacity:.9} 41%{opacity:1} 70%{opacity:.94} }
  #passShadow { position:absolute; inset:0; pointer-events:none; z-index:5; opacity:0;
    background:linear-gradient(90deg, transparent 0%, #000000aa 45%, #000000aa 55%, transparent 100%); background-size:60% 100%; background-repeat:no-repeat; }
  #passShadow.go { animation:pass 2.4s ease-in-out; }
  @keyframes pass { 0% { opacity:0; background-position:-80% 0; } 20% { opacity:.9; } 80% { opacity:.9; } 100% { opacity:0; background-position:180% 0; } }
  /* 책을 묶은 실의 끝: 서고에 무슨 일이 생기면 떨림 */
  #thread { position:absolute; z-index:1; overflow:visible; }   /* 책 밑에서 나와 책상에 깔림: 넘어가는 종이가 실 위로 지나감 */
  #thread .hit { cursor:pointer; pointer-events:stroke; }
  #thread:hover { opacity:1; }
  #bookBar { margin-top:96px; display:flex; gap:12px; min-height:34px; }
  .sbtn { background:none; border:1px solid #6d635099; color:#bfb293; padding:7px 14px; font:inherit; font-size:13px; letter-spacing:2px; cursor:pointer; }

  /* 넘기는 낱장(가는 띠를 이어 붙인 한지) */
  #leaf { position:absolute; top:0; transform-style:preserve-3d; pointer-events:none; display:none; z-index:3; }
  .strip { position:absolute; top:0; height:100%; transform-style:preserve-3d; transform-origin:right center; }
  .sface { position:absolute; top:0; bottom:0; left:-0.5px; right:-0.5px; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; background-color:var(--paper); }
  .sface.back { transform:rotateY(180deg); }
  .pc { position:absolute; top:0; height:100%; background-color:var(--paper); color:var(--ink); }
  .sh { position:absolute; inset:0; pointer-events:none; background:#4a3418; opacity:0; }

  /* 표지(오침안정법) */
  #cover { position:absolute; z-index:6; cursor:pointer; }
  .coverFace { background-color:#8a6a34; box-shadow:0 10px 40px #000c, inset 0 0 30px #3a2a1066;
    background-image:repeating-linear-gradient(45deg, #0000 0 10px, #ffffff0d 10px 11px), repeating-linear-gradient(-45deg, #0000 0 10px, #0000000d 10px 11px); }
  .coverFace .slip { position:absolute; left:12%; top:6%; width:16%; height:50%; background:#e2d6b8; box-shadow:0 0 0 1px #00000033;
    writing-mode:vertical-rl; display:flex; align-items:center; justify-content:center; font-size:16px; letter-spacing:8px; color:#5a4a36; }
  .coverFace .bind { position:absolute; right:0; top:0; bottom:0; width:10%; border-left:1px solid #00000033; }
  .coverFace .hole { position:absolute; left:30%; width:5px; height:5px; border-radius:50%; background:#2a1a0a; transform:translateY(-50%); }
  .coverFace .thr { position:absolute; left:34%; right:0; height:2px; background:#e8e0cc; transform:translateY(-50%); }
  .coverFace .thrv { position:absolute; left:34%; top:0; bottom:0; width:2px; background:#e8e0cc; }

  /* 돋보기 */
  #loupe { position:absolute; width:150px; height:150px; border-radius:50%; overflow:hidden; display:none; z-index:6; pointer-events:none;
    background:var(--paper); border:4px solid #8a7a4a; box-shadow:0 0 0 2px #0009, 0 10px 24px #000a, inset 0 0 18px #0004; }
  #lz { position:absolute; left:0; top:0; transform-origin:0 0; display:flex; }
  #book.loupe { cursor:none; touch-action:none; }

  /* 시작·족보·가훈 */
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); z-index:20; }
  #title { font-size:30px; letter-spacing:10px; color:#8d8168; margin-bottom:60px; }
  .btn { background:none; border:1px solid #6d6350; color:#cfc3a8; padding:10px 26px; font:inherit; font-size:16px; letter-spacing:4px; cursor:pointer; }
  .hanji { background:var(--paper); color:var(--ink); padding:28px 30px; width:min(92vw,420px); box-shadow:0 10px 40px #000; }
  .hanji h2 { text-align:center; letter-spacing:14px; margin:0 0 20px; font-weight:700; }
  .row { display:flex; align-items:center; gap:10px; margin:12px 0; font-size:15px; }
  .row .gen { width:56px; color:#5a4a36; }
  .scratch { flex:1; height:16px; background:repeating-linear-gradient(-20deg,#2a2118 0 2px,transparent 2px 5px); opacity:.55; }
  .row input { font:inherit; font-size:16px; background:transparent; border:none; border-bottom:1px solid #00000055; color:var(--ink); padding:2px 4px; width:100%; outline:none; }
  .row label { white-space:nowrap; font-size:13px; color:#5a4a36; }
  .faint { color:#5a4a3680; }
  #gahunWrap { display:flex; gap:28px; }
  .scroll { background:var(--paper); color:var(--ink); writing-mode:vertical-rl; font-size:22px; letter-spacing:8px;
    padding:26px 18px; min-height:300px; border-top:10px solid #3a2a1c; border-bottom:10px solid #3a2a1c; cursor:pointer; box-shadow:0 8px 30px #000; }

  /* 기록 창 */
  #overlay { position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center; z-index:30; }
  #overlay .hanji { max-height:84vh; overflow:auto; font-size:15px; line-height:1.9; }
  #overlay .hanji h3 { margin:0 0 12px; letter-spacing:6px; font-size:16px; }
  .rec { padding:8px 0; border-bottom:1px solid #00000022; cursor:pointer; }
  .close { margin-top:18px; text-align:center; font-size:13px; opacity:.6; }
  .side { cursor:pointer; min-height:220px; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .side .hj { font-size:26px; letter-spacing:6px; margin:10px 0 18px; }
  .side .kr { font-size:15px; min-height:1.9em; }
  .side .note { font-size:14px; color:#6a2a16; font-style:italic; transform:rotate(-1.2deg); padding:0 6px; }
  .side .pg { font-size:11px; opacity:.5; margin-top:22px; }
  .spine { display:flex; justify-content:space-between; }
  .opt { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #00000022; padding:10px 0; }
  .opt .ch { display:flex; gap:6px; }
  .opt .ch span { padding:3px 10px; border:1px solid #00000033; cursor:pointer; font-size:14px; }
  .opt .ch span.on { background:#3a2a1c; color:var(--paper); }
</style>
</head>
<body>
<div id="room"><canvas id="cv"></canvas><div id="endnote">— 체험판은 여기까지입니다 —</div></div>
<div id="counter">쪽 <span id="cnt">0</span></div>
<div id="setBtn">설정</div>
<div id="fear"></div>

<div id="bookView" class="hidden">
  <div id="stage">
    <div id="book">
      <div id="faces"></div>
      <div id="leaf"></div>
      <div id="loupe"><div id="lz"></div></div>
      <div id="passShadow"></div>
    </div>
    <div id="cover" class="coverFace"><div class="slip">□□</div><div class="bind"></div></div>
    <svg id="thread" width="150" height="70" viewBox="0 0 150 70">
      <defs><filter id="tblur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="0.9"/></filter></defs>
      <path class="tsh" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round" transform="translate(0.6,1.6)" filter="url(#tblur)"/>
      <path class="tln" fill="none" stroke="#cdbf9c" stroke-width="2.2" stroke-linecap="round"/>
      <path class="ttw" fill="none" stroke="#8f8264" stroke-width="2.2" stroke-dasharray="1.2 2.6" stroke-linecap="butt"/>
      <g class="tas"><ellipse cx="1" cy="1.5" rx="7" ry="3.2" fill="#000" opacity=".4" filter="url(#tblur)"/><path d="M0 0 L11 -2.5 L12 3.5 Z" fill="#c9bb98"/><path d="M2 0 L11 -1.2 M2 0.8 L11.5 1 M2 1.6 L11.8 2.6" stroke="#9a8d6c" stroke-width=".5"/></g>
      <path class="hit" fill="none" stroke="transparent" stroke-width="28" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="dimL" class="lightL"></div><div id="warmL" class="lightL"></div>
  <div id="bookBar"><button class="sbtn" id="bGlass">돋보기</button><button class="sbtn hidden" id="bClose">책을 덮는다</button></div>
</div>

<div class="screen" id="sStart"><div id="title">□□ — □□□□□</div><button class="btn" id="bOpen">궤짝을 연다</button></div>
<div class="screen hidden" id="sJokbo">
  <div class="hanji">
    <h2>族譜</h2>
    <div class="row"><span class="gen">一世</span><span class="scratch"></span></div>
    <div class="row faint"><span class="gen">二世</span>…</div>
    <div class="row faint"><span class="gen">十六世</span>…</div>
    <div class="row"><span class="gen">十七世</span></div>
    <div class="row"><label>성(姓)</label><input id="iSur" maxlength="2" placeholder="윤"><label>본관</label><input id="iBon" maxlength="4" placeholder="파평"></div>
    <div class="row"><label>이름</label><input id="iName" maxlength="3" placeholder="서하"></div>
    <div style="text-align:center;margin-top:22px"><button class="btn" id="bWrite" style="color:var(--ink);border-color:#00000066">적는다</button></div>
  </div>
</div>
<div class="screen hidden" id="sGahun">
  <div id="gahunWrap"><div class="scroll" data-g="0">읽되 믿지 마라</div><div class="scroll" data-g="1">모르는 것은 덮어라</div></div>
</div>
<div id="overlay" class="hidden"><div class="hanji" id="ovBody"></div></div>

<script>
(() => {
'use strict';
// ───────── 상태 ─────────
const SAVE = 'yeobaek_trial_v1';
if (/[?&]new\b/.test(location.search)) { localStorage.removeItem(SAVE); history.replaceState(null, '', location.pathname); }
const S = Object.assign({
  stage:'start', sur:'', bon:'', name:'', gahun:-1,
  pages:0, earned:0, D:0, owned:{}, fear:0, opened:false,
  letterRead:false, chair:false, glitchDone:false, sideRead:{}, opt:{ horiz:false, mute:false }
}, JSON.parse(localStorage.getItem(SAVE) || '{}'));
S.opt = Object.assign({ horiz:false, mute:false }, S.opt); S.sideRead = S.sideRead || {}; S.owned = S.owned || {};
let resetting = false;
const save = () => { if (!resetting) localStorage.setItem(SAVE, JSON.stringify(S)); };
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ───────── 성씨 한자 ─────────
const HJ = {김:'金',이:'李',박:'朴',최:'崔',정:'鄭',강:'姜',조:'趙',윤:'尹',장:'張',임:'林',한:'韓',오:'吳',서:'徐',신:'申',권:'權',황:'黃',안:'安',송:'宋',류:'柳',유:'柳',전:'全',홍:'洪',고:'高',문:'文',양:'梁',손:'孫',배:'裵',백:'白',허:'許',남:'南',심:'沈',노:'盧',하:'河',곽:'郭',성:'成',차:'車',주:'朱',우:'禹',구:'具',민:'閔',진:'陳',나:'羅',지:'池',엄:'嚴',채:'蔡',원:'元',천:'千',방:'方',공:'孔',현:'玄',함:'咸',변:'卞',염:'廉',여:'呂',추:'秋',도:'都',소:'蘇',석:'石',선:'宣',설:'薛',마:'馬',길:'吉',연:'延',위:'魏',표:'表',명:'明',기:'奇',반:'潘',왕:'王',금:'琴',옥:'玉',육:'陸',인:'印',맹:'孟',제:'諸',탁:'卓',국:'鞠',어:'魚',은:'殷',편:'片',용:'龍',예:'芮',경:'景',봉:'奉',사:'史',부:'夫',모:'牟',태:'太',호:'胡',피:'皮',빈:'賓',라:'羅',갈:'葛',궁:'宮',보:'甫',독:'獨'};
const TWO = {남궁:'南宮',제갈:'諸葛',선우:'鮮于',독고:'獨孤',황보:'皇甫',사공:'司空',서문:'西門'};
const hanjaOf = s => TWO[s] || Array.from(s).map(c => HJ[c] || c).join('');

// ───────── 낯선 문자 ─────────
function rng(seed){ let x = seed*9301+49297; return () => (x = (x*9301+49297)%233280)/233280; }
function glyphs(model, seed){ const r = rng(seed); return Array.from(model).map(c => /\s/.test(c) ? c : String.fromCharCode(0x2F00 + Math.floor(r()*214))).join(''); }
const hash = (a,b) => { let h = (a*374761393 + b*668265263) >>> 0; h = (h^(h>>>13))*1274126177 >>> 0; return (h % 1000)/1000; };
const isAlien = ch => { const c = ch.codePointAt(0); return c >= 0x2F00 && c <= 0x2FD5; };
const agSpan = (ch,k) => `<span class="ag r${(ch.codePointAt(0)+k)%5}">${ch}</span>`;
const alienHtml = str => Array.from(str).map((ch,k) => isAlien(ch) ? agSpan(ch,k) : esc(ch)).join('');

// ───────── 첫 책 문장 ─────────
function buildLines(){
  const s = S.sur || '윤', h = hanjaOf(s);
  const L = [
    { idu:`${h}氏 家門 書庫良中 藏置爲乎 冊 數爻乙 後錄爲白齊`, old:`${s}시 가문 셔고애 갈ᄆᆞ 둔 ᄎᆡᆨ 수ᄅᆞᆯ 뒤헤 젹ᄂᆞ니라`, mod:`${s}씨 가문 서고에 갈무리해 둔 책의 수를 뒤에 적는다.` },
    { idu:'小學 一卷 前張是 落去爲齊', old:'쇼ᄒᆞᆨ ᄒᆞᆫ 권. 앏 쟝이 ᄠᅥ러뎌 나감.', mod:'소학 한 권. 앞 장이 떨어져 나감.' },
    { idu:'農家集成 二卷', old:'농가집셩 두 권.', mod:'농가집성 두 권.' },
    { idu:'東醫寶鑑 雜病篇 三卷 肝乙 論爲在 張良中 手垢多齊', old:'동의보감 잡병편 세 권. 간ᄋᆞᆯ 다론 쟝애 손ᄣᅢ 만ᄒᆞᆷ.', mod:'동의보감 잡병편 세 권. 간(肝)을 다룬 장에 손때가 많음.' },
    { idu:'時調 一束 誰矣 編爲乎喩 不知齊', old:'시됴 무금 ᄒᆞᆫ 권. 뉘 엮건디 모ᄅᆞᆷ.', mod:'시조 묶음 한 권. 누가 엮었는지 모름.' },
    { idu:'地圖 一張 海邊 半是 空爲齊', old:'디도 ᄒᆞᆫ 쟝. 바ᄅᆞᆯ 녁 반이 뷔여 이숌.', mod:'지도 한 장. 바다 쪽 절반이 비어 있음.' },
    { idu:'無題冊 一卷 櫃中', old:'뎨목 업슨 ᄎᆡᆨ ᄒᆞᆫ 권. 궤ᄶᆞᆨ 안.', mod:'제목 없는 책 한 권. 궤짝 안.' },
    { idu:'都合 十三卷', old:'모도 열세 권.', mod:'모두 열세 권.' },
    { idu:'夜良中 此冊乙 越爲在 者隱', old:'밤의 이 ᄎᆡᆨ을 넘기ᄂᆞᆫ 이ᄂᆞᆫ', mod:'밤에 이 책을 넘기는 이는' },

let W=0, H=0, DPR=1, SC=4, ang=-0.35, drag=0, t0=performance.now(), steamUntil=0, glitchUntil=0;
function resize(){ const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio||1);
  W = cv.width = Math.floor(r.width*DPR); H = cv.height = Math.floor(r.height*DPR);
  SC = Math.max(2, Math.floor(Math.min(W/96, H/78))); }
window.addEventListener('resize', resize);
function drawModel(m, sx, sy, a, alpha, z0=0){
  const step = SC*0.85; cx.globalAlpha = alpha;
  for (let z=0; z<m.h; z++){ const L = m.layers[z]; if (!L) continue;
    for (let k=0; k<Math.ceil(step); k++){ cx.save(); cx.translate(sx, sy - (z+z0)*step - k); cx.scale(SC, SC*0.6); cx.rotate(a); cx.drawImage(L, -m.w/2, -m.d/2); cx.restore(); }
  }
  cx.globalAlpha = 1;
}
function frame(now){
  const t = (now - t0)/1000, a = ang + Math.sin(t*0.12)*0.1 + drag, c = Math.cos(a), s = Math.sin(a), ox = W/2, oy = H*0.58;
  if (bookView.classList.contains('hidden')){
    cx.fillStyle = '#0b0907'; cx.fillRect(0,0,W,H); cx.imageSmoothingEnabled = false;
    drawModel(M.floor, ox, oy, a, 1, -1);
    const list = [];
    for (const o of OBJ){
      const owned = !o.buy || S.owned[o.id];
      if (o.show && !o.show()) { o.hit=null; continue; }
      const ghost = o.buy && !owned;
      if (ghost && S.earned < o.buy.cost*0.5) { o.hit=null; continue; }
      const rx = o.x*c - o.y*s, ry = o.x*s + o.y*c;
      list.push({ o, ghost, sx: ox + rx*SC, sy: oy + ry*SC*0.6, ry });
    }
    list.sort((p,q)=>p.ry-q.ry);
    for (const it of list){
      const m = M[it.o.m ? it.o.m() : it.o.id];
      let alpha = it.ghost ? (S.pages >= it.o.buy.cost ? 0.42 : 0.18) : 1;
      if (it.o.glow && it.o.glow()) alpha = 0.72 + 0.28*Math.sin(t*3);
      drawModel(m, it.sx, it.sy, a + (it.o.rot||0), alpha, it.o.z||0);
      it.o.hit = { x: it.sx, y0: it.sy - (it.o.z||0)*SC*0.85, y1: it.sy - (m.h + (it.o.z||0) + (it.ghost ? 8 : 0))*SC*0.85, r: Math.max(Math.max(m.w, m.d)*SC*0.5, 28*DPR), ghost: it.ghost };
      if (it.ghost){ cx.font = `${12*DPR}px serif`; cx.fillStyle = S.pages >= it.o.buy.cost ? '#cfc3a8' : '#6d6350'; cx.textAlign='center'; cx.fillText(`${it.o.buy.name} ${it.o.buy.cost}쪽`, it.sx, it.sy - (m.h+4)*SC*0.85); }
      if (it.o.id==='lamp' && !it.ghost){ const fy = it.sy - 7*SC*0.85, fl = 0.6+0.4*Math.sin(t*11)*Math.sin(t*7.3);
        const g = cx.createRadialGradient(it.sx, fy, 0, it.sx, fy, 30*DPR); g.addColorStop(0,`rgba(255,190,90,${0.35*fl})`); g.addColorStop(1,'rgba(255,190,90,0)');
        cx.fillStyle=g; cx.fillRect(it.sx-30*DPR, fy-30*DPR, 60*DPR, 60*DPR); }
      if (it.o.id==='teapot' && now < steamUntil){ cx.fillStyle='rgba(220,215,200,0.5)';
        for (let k=0;k<6;k++){ const ph=(t*1.5+k/6)%1; cx.fillRect(it.sx + Math.sin(t*3+k)*4*DPR, it.sy - 6*SC*0.85 - ph*40*DPR, SC*0.8, SC*0.8); } }
    }
    const lit = S.owned.lamp ? 1 : 0;
    const g = cx.createRadialGradient(ox, oy-20*DPR, Math.min(W,H)*(0.18+0.12*lit), ox, oy, Math.max(W,H)*0.62);
    g.addColorStop(0,'rgba(8,6,4,0)'); g.addColorStop(1,'rgba(8,6,4,0.92)'); cx.fillStyle = g; cx.fillRect(0,0,W,H);
  }

}

const cnt = document.getElementById('cnt');
let lastTick = performance.now(), lastAuto = performance.now();
function tick(now){
  const dt = Math.min(0.5, (now - lastTick)/1000); lastTick = now;
  if (S.stage !== 'room') return;
  if (S.D >= T.fearOn && now > steamUntil) S.fear = Math.min(0.8, S.fear + dt*0.025*(S.sideRead.dongui ? 0.6 : 1));
  document.getElementById('fear').style.opacity = S.fear.toFixed(2);
  let txt = String(S.pages);
  if (!S.glitchDone && S.D >= T.glitch){ S.glitchDone = true; glitchUntil = now + 200; save(); }
  if (now < glitchUntil && txt.length){ const k = txt.length-1; txt = txt.slice(0,k) + ((+txt[k]+3)%10); }
  cnt.textContent = txt;
  updateThread(now);
  if (bookOpen && !bookView.classList.contains('hidden')) { threadPh += threadStir ? dt*5.5 : 0; drawThread(threadStir ? 5 : 0); }
  if (S.owned.desk && S.D < T.letter && now - lastAuto > 9000 && now - lastFlip > 4000 && ov.classList.contains('hidden')){ lastAuto = now; flip(true); }
}

  const n = [];
  for (const o of OBJ) if (o.buy && !S.owned[o.id] && S.pages >= o.buy.cost) n.push('buy:' + o.id);
  if (S.D >= T.door) n.push('door');
  if (S.D >= T.tea) n.push('teapot');
  if (S.D >= T.letter && !S.letterRead) n.push('letter');
  return n;
}
let lastNewsCheck = 0, threadStir = false, threadPh = 0;
function drawThread(amp){
  const th = document.getElementById('thread'); if (!th) return;
  const w = Math.sin(threadPh), w2 = Math.sin(threadPh*1.7 + 1);
  // 묶은 자리(책 아래 끝)에서 나와 책상 위에 옆으로 비스듬히 누움. 꿈틀거릴 땐 가운데가 들썩임
  const x0 = 20, y0 = 2, x1 = 46, y1 = 22 + amp*w*0.6, x2 = 88, y2 = 30 + amp*w2, x3 = 128 + amp*w*0.4, y3 = 40;
  const d = `M${x0},${y0} C${x0+4},${y0+12} ${x1-14},${y1-2} ${x1},${y1} S${x2-16},${y2-6} ${x2},${y2} S${x3-14},${y3-8} ${x3},${y3}`;
  th.querySelectorAll('.tsh,.tln,.ttw,.hit').forEach(p => p.setAttribute('d', d));
  th.querySelector('.tas').setAttribute('transform', `translate(${x3},${y3}) rotate(${18 + amp*w*4})`);
}
function updateThread(now){

  threadStir = bookOpen && (fresh.length > 0 || urgent);

    S.letterShadow = true; save();

  }

  const d = down; down = null; if (!d || d.moved || S.stage !== 'room') return;
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left)*DPR, py = (e.clientY - r.top)*DPR;
  let best = null, bd = 1e9;
  for (const o of OBJ){ if (!o.hit) continue; const h = o.hit, cy = Math.max(h.y1, Math.min(h.y0, py)), dd = Math.hypot(px-h.x, py-cy); if (dd < h.r && dd < bd){ bd = dd; best = o; } }
  if (!best) return;
  if (best.hit.ghost) buy(best); else if (best.click) best.click(); else if (ITEM[best.id]) showItem(best.id);
});

// ───────── 화면 전환 ─────────
const scr = id => ['sStart','sJokbo','sGahun'].forEach(k => document.getElementById(k).classList.toggle('hidden', k !== id));
function enterRoom(){ S.stage = 'room'; save(); scr(null); LINES = buildLines(); resize(); if (!S.opened) openBook(); }
document.getElementById('bOpen').onclick = () => { ac(); sFlip(); S.stage = 'jokbo'; scr('sJokbo'); };
// 비워 두고 '적는다'를 누르면 흐리게 적힌 예시(또는 지난번에 쓴 이름) 그대로 시작
const LAST = 'yeobaek_last_name';
(() => { try { const l = JSON.parse(localStorage.getItem(LAST) || 'null'); if (l) { iSur.placeholder = l.sur; iBon.placeholder = l.bon || iBon.placeholder; iName.placeholder = l.name; } } catch(_){} })();
document.getElementById('bWrite').onclick = () => {
  const val = el => el.value.trim() || el.placeholder;
  const sur = val(iSur), nm = val(iName);
  try { localStorage.setItem(LAST, JSON.stringify({ sur, bon: val(iBon), name: nm })); } catch(_){}
  if (!/^[가-힣]{1,2}$/.test(sur) || !/^[가-힣]{1,3}$/.test(nm)) { document.getElementById(!/^[가-힣]{1,2}$/.test(sur)?'iSur':'iName').focus(); return; }
  S.sur = sur; S.name = nm; S.bon = val(iBon); sFlip(); S.stage = 'gahun'; save(); scr('sGahun');
};
document.querySelectorAll('.scroll').forEach(el => el.onclick = () => { S.gahun = +el.dataset.g; sPlace(); enterRoom(); });

window.__yb = { openBook, closeBook, toggleLoupe, hits: () => OBJ.filter(o => o.hit).map(o => ({ id:o.id, x:o.hit.x/DPR, y:(o.hit.y0*0.4 + o.hit.y1*0.6)/DPR })) };
resize();
if (S.stage === 'room') enterRoom(); else if (S.stage === 'gahun') scr('sGahun'); else if (S.stage === 'jokbo') scr('sJokbo'); else scr('sStart');
setInterval(() => { if (S.stage === 'room') save(); }, 2000);
requestAnimationFrame(frame);
})();
</script>
